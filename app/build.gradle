import groovy.json.JsonOutput

plugins {
    id 'com.android.application'
}

def licenseUrl = (findProperty('ceilingLicenseUrl') ?: System.getenv('CEILING_LICENSE_URL') ?: '').toString().trim()
def licenseKey = (findProperty('ceilingLicensePublicKeyB64') ?: System.getenv('CEILING_LICENSE_PUBLIC_KEY_B64') ?: '').toString().trim()
if ((licenseUrl.isEmpty() != licenseKey.isEmpty()) || (!licenseUrl.isEmpty() && !licenseUrl.startsWith('https://'))) {
    throw new GradleException('Set BOTH CEILING_LICENSE_URL (https) and CEILING_LICENSE_PUBLIC_KEY_B64 or neither')
}

android {
    namespace 'ru.xalidmuslim.ceilingmeasure'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.xalidmuslim.ceilingmeasure'
        minSdk 29
        targetSdk 35
        versionCode 231
        versionName '1.0.231-native'

        buildConfigField 'String', 'LICENSE_SERVER_URL', JsonOutput.toJson(licenseUrl)
        buildConfigField 'String', 'LICENSE_PUBLIC_KEY_B64', JsonOutput.toJson(licenseKey)

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    sourceSets {
        main {
            res.srcDirs += ["$buildDir/generated/iconRes"]
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            // Side-by-side preview APK: cannot overwrite production v224/v226
            // or change a customer's saved ceiling drawings.
            applicationIdSuffix '.preview'
        }
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        buildConfig true
    }

    testOptions {
        animationsDisabled = true
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = false
    }

    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

tasks.register('prepareLauncherIcon', Copy) {
    from("$rootDir/branding/app_icon_master_1024.webp")
    into("$buildDir/generated/iconRes/drawable-nodpi")
    rename { 'app_icon_master.webp' }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('prepareLauncherIcon')
}

dependencies {
    implementation 'androidx.activity:activity:1.9.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'

    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}


configurations.configureEach {
    // Keep one modern Kotlin runtime across AndroidX + Unified Test Platform.
    // Older split JDK7/JDK8 artifacts create duplicate classes; UTP itself needs
    // EnumEntriesKt, which is present in Kotlin 1.9.x.
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy.force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
}
