name: CeilingMeasure v262 Public Direct APK Release

on:
  push:
    branches: [feature/v262-compact-overview-visible-navigation]
    paths:
      - '.github/workflows/ceiling-v262-github-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-v262:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed v262 preview and rerun unit/lint checks
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleReleasePreview
          test -s app/build/outputs/apk/releasePreview/app-releasePreview.apk
          mkdir -p release
          cp app/build/outputs/apk/releasePreview/app-releasePreview.apk release/Zamer-v262.apk
          sha256sum release/Zamer-v262.apk
      - name: Publish direct APK on GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zamer-v262-preview
          target_commitish: ${{ github.sha }}
          name: "Замер потолков v262 — компактная сводка и плавная навигация"
          prerelease: true
          draft: false
          fail_on_unmatched_files: true
          files: release/Zamer-v262.apk
          body: |
            Тестовая Android APK v262 (нативный Java, R8).
            Уменьшены суммарные показатели площади и периметра в сводке комнат;
            обычное плавное появление/закрытие смет и материалов;
            ускоренное синее выделение нижней навигации.
            Пройдено тестирование на Android 15 Emulator в workflow 41348883182.
            Физический телефон не проверялся.
            Preview ставится отдельно (.smooth262), сохраненные данные основного приложения не заменяет.
