name: Native Full Fix APK

on:
  push:
    branches:
      - fix/native-full-app-2026-09-29
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-full-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify native-only source
        shell: bash
        run: |
          set -euo pipefail
          test ! -f app/src/main/assets/index.html
          test ! -f app/src/main/java/ru/xalidmuslim/ceilingmeasure/MainActivity.java
          if grep -R -E "android\.webkit\.WebView|androidx\.webkit" app/src/main/java app/build.gradle; then
            echo "WebView/WebKit found in native build"
            exit 1
          fi
          grep -q 'class NativeWorkspaceActivity' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeWorkspaceActivity.java
          grep -q 'class CeilingDrawingView' app/src/main/java/ru/xalidmuslim/ceilingmeasure/CeilingDrawingView.java
          grep -q 'static Result solveFactual' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeMeasurementSolver.java

      - name: Lint unit tests and assemble
        run: gradle --no-daemon clean lintDebug testDebugUnitTest assembleDebug

      - name: Verify APK is native
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          if unzip -l "$APK" | grep -q 'assets/index.html'; then
            echo "HTML asset unexpectedly packaged"
            exit 1
          fi

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CeilingMeasure-native-full-fix-v211
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
