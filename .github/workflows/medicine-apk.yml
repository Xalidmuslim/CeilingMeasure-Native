name: Build Medicina Proroka APK

on:
  push:
    branches:
      - build/medicina-proroka-apk
    paths:
      - 'medicine-apk/**'
      - '.github/workflows/medicine-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: medicine-apk
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp medicine-apk/app/build/outputs/apk/debug/app-debug.apk medicina-proroka.apk
          sha256sum medicina-proroka.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: medicina-proroka-apk
          path: medicina-proroka.apk
          if-no-files-found: error
          retention-days: 30
