name: CeilingMeasure v247 Medicine Smooth Motion

on:
  push:
    branches:
      - perf/v247-medicine-smooth-motion-clean-icon
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceiling-v247-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r8-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Lint, unit tests, test APK and R8 release APK
        run: gradle --no-daemon clean lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleReleasePreview
      - name: Verify Android APK and R8 mapping
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          test -s app/build/outputs/apk/releasePreview/app-releasePreview.apk
          test -s app/build/outputs/mapping/releasePreview/mapping.txt
          bash scripts/test_run_android_smoke.sh
          sha256sum app/build/outputs/apk/releasePreview/app-releasePreview.apk
      - name: Upload optimized v247 R8 APK
        uses: actions/upload-artifact@v4
        with:
          name: CeilingMeasure-v247-R8-optimized-APK
          path: app/build/outputs/apk/releasePreview/app-releasePreview.apk
          retention-days: 30
          if-no-files-found: error
      - name: Upload debug instrumentation APKs
        uses: actions/upload-artifact@v4
        with:
          name: CeilingMeasure-v247-debug-tests
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 30
          if-no-files-found: error

  android-navigation:
    needs: r8-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Get R8 release APK
        uses: actions/download-artifact@v4
        with:
          name: CeilingMeasure-v247-R8-optimized-APK
          path: build/release
      - name: Get instrumentation APKs
        uses: actions/download-artifact@v4
        with:
          name: CeilingMeasure-v247-debug-tests
          path: build/tests
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Medicine Smooth Motion navigation, icon, cold start and scroll on API35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-boot-timeout: 600
          script: |
            bash scripts/test_v244_navigation.sh \
              build/release/app-releasePreview.apk \
              build/tests/debug/app-debug.apk \
              build/tests/androidTest/debug/app-debug-androidTest.apk
            bash scripts/test_v247_medicine_motion.sh
      - name: Save emulator navigation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CeilingMeasure-v247-navigation-proof
          path: |
            build/v246-evidence/
            build/v247-performance/
          retention-days: 30
          if-no-files-found: warn
