name: CeilingMeasure v230 Nav Prices Performance APK

on:
  push:
    branches:
      - feature/navigation-price-drag-performance-v230
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceiling-v230-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-tests-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Lint, unit tests, APK and Android test compilation
        run: gradle --no-daemon clean lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Validate native APK and run focused regressions
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          bash scripts/test_run_android_smoke.sh
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.html'; then
            echo 'Legacy WebView content unexpectedly packaged'
            exit 1
          fi
      - name: Upload v230 preview APK
        uses: actions/upload-artifact@v4
        with:
          name: CeilingMeasure-v230-navigation-price-drag-performance-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
