name: CeilingMeasure v240 Centered Estimate Figures APK

on:
  push:
    branches:
      - fix/v240-centered-estimate-inputs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceiling-v240-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Android native sources and APK
        run: gradle --no-daemon clean lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Validate smoke runner and APK contents
        run: |
          set -euo pipefail
          bash scripts/test_run_android_smoke.sh
          test -s app/build/outputs/apk/debug/app-debug.apk
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.html'; then
            echo "Unexpected legacy WebView bundle"
            exit 1
          fi
      - name: Upload v240 APK
        uses: actions/upload-artifact@v4
        with:
          name: CeilingMeasure-v240-centered-estimate-inputs-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
