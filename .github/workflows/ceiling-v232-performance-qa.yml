name: CeilingMeasure v232 Performance and QA APK

on:
  push:
    branches:
      - feature/v232-gesture-navigation-qa
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceiling-v232-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate UI and native APK
        run: gradle --no-daemon clean lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Check instrumentation runner and native-only archive
        run: |
          set -euo pipefail
          bash scripts/test_run_android_smoke.sh
          test -s app/build/outputs/apk/debug/app-debug.apk
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.html'; then
            echo "Unexpected legacy WebView asset"
            exit 1
          fi
      - name: Publish optimized v232 preview APK
        uses: actions/upload-artifact@v4
        with:
          name: CeilingMeasure-v232-performance-qa-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
