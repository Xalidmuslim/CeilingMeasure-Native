name: CeilingMeasure v229 Native Keyboard and Gesture APK

on:
  push:
    branches:
      - feature/native-ime-styled-dialogs-gesture-v229
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceiling-v229-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Lint, Java tests, APK and instrumentation compile
        run: gradle --no-daemon clean lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Verify native preview package
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.html'; then
            echo 'Legacy WebView content unexpectedly packaged'
            exit 1
          fi
      - name: Publish v229 preview APK
        uses: actions/upload-artifact@v4
        with:
          name: CeilingMeasure-v229-native-ime-quick-touch-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
