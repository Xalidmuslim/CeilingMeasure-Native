name: Arabic Grammar APK

on:
  push:
    branches:
      - feature/arabic-grammar-app-2026-10-03
    paths:
      - 'ArabicGrammarApp/**'
      - '.github/workflows/arabic-grammar-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch and validate full Unicode book
        working-directory: ArabicGrammarApp
        run: node scripts/fetch-book.mjs

      - name: Build structured SQLite book database
        working-directory: ArabicGrammarApp
        run: python3 scripts/build-db.py

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ArabicGrammarApp
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          test -f ArabicGrammarApp/app/build/outputs/apk/debug/app-debug.apk
          unzip -l ArabicGrammarApp/app/build/outputs/apk/debug/app-debug.apk | grep 'assets/book/book.db'
          ! unzip -l ArabicGrammarApp/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.html'
          ! unzip -l ArabicGrammarApp/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/app.js'
          ls -lh ArabicGrammarApp/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: arabic-grammar-debug-apk
          path: ArabicGrammarApp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload content audit
        uses: actions/upload-artifact@v4
        with:
          name: arabic-grammar-content-json
          path: |
            ArabicGrammarApp/build/book-source/content.json
            ArabicGrammarApp/app/src/main/assets/book/book.db
          if-no-files-found: error
          retention-days: 30
