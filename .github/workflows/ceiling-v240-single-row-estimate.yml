name: CeilingMeasure v240 One-Row Estimate APK

on:
  push:
    branches:
      - design/v240-true-dense-estimate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceiling-v240-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Lint, JUnit, Android UI test compilation and APK
        run: gradle --no-daemon clean lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Validate APK and smoke runner
        run: |
          set -euo pipefail
          bash scripts/test_run_android_smoke.sh
          test -s app/build/outputs/apk/debug/app-debug.apk
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.html'; then
            echo "Unexpected WebView asset"
            exit 1
          fi
      - name: Publish v240 preview APK
        uses: actions/upload-artifact@v4
        with:
          name: CeilingMeasure-v240-single-row-estimate-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
