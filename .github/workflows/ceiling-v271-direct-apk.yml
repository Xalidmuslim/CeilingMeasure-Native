name: Publish direct v271 APK (no ZIP)

on:
  push:
    branches: [feature/v271-direct-plus-trash-material-order]
    paths:
      - 'app/build.gradle'
      - '.github/workflows/ceiling-v271-direct-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v271-direct-apk
  cancel-in-progress: false

jobs:
  publish-direct-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile, unit test, lint and R8 optimize
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleReleasePreview
          test -s app/build/outputs/apk/releasePreview/app-releasePreview.apk
          cp app/build/outputs/apk/releasePreview/app-releasePreview.apk Zamer-v271.apk
          unzip -t Zamer-v271.apk | tail -n 2
          sha256sum Zamer-v271.apk
      - name: Upload APK for direct in-chat attachment
        uses: actions/upload-artifact@v4
        with:
          name: zamer-v271-apk
          path: Zamer-v271.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish raw APK as prerelease asset (not Actions ZIP)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view zamer-v271-preview --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload zamer-v271-preview Zamer-v271.apk --repo "${{ github.repository }}" --clobber
          else
            gh release create zamer-v271-preview Zamer-v271.apk \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "Замер потолков v271 — прямой APK (тестовая версия)" \
              --notes "Тестовая установка с отдельным пакетом .smooth271: плюс открывает чертёж, корзина для замеров, дюбель под багетом и автосохранение. Данные других установок остаются отдельными и автоматически сюда не переносятся. Не для коммерческого распространения без полного QA." \
              --prerelease
          fi
