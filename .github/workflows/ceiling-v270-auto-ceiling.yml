name: CeilingMeasure v270 Automatic Idle Ceiling Installation

on:
  push:
    branches: [feature/v270-auto-ceiling-installation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceiling-v270-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: JVM regression, lint and optimized APK
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleReleasePreview
          test -s app/build/outputs/apk/releasePreview/app-releasePreview.apk
          sha256sum app/build/outputs/apk/releasePreview/app-releasePreview.apk
      - name: Upload v270 direct APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CeilingMeasure-v270-section-swipe
          path: app/build/outputs/apk/releasePreview/app-releasePreview.apk
          if-no-files-found: error
          retention-days: 30
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 project grid and dialog navigation regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-boot-timeout: 600
          script: |
            set -eu
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class ru.xalidmuslim.ceilingmeasure.NativeProjectOverviewUiTest,ru.xalidmuslim.ceilingmeasure.NativeCompactOverviewMotionTest,ru.xalidmuslim.ceilingmeasure.NativeEstimateFullScreenNavigationTest,ru.xalidmuslim.ceilingmeasure.NativeFastNavigationAndOrdinaryDialogsTest,ru.xalidmuslim.ceilingmeasure.NativePriceDragUiTest,ru.xalidmuslim.ceilingmeasure.NativeHomeReplayMotionTest,ru.xalidmuslim.ceilingmeasure.NativeHomeInstallationUiTest,ru.xalidmuslim.ceilingmeasure.NativeHomeIdleInstallationUiTest,ru.xalidmuslim.ceilingmeasure.NativeWorkspaceSectionsSwipeTest,ru.xalidmuslim.ceilingmeasure.NativeFixedNavigationUiTest,ru.xalidmuslim.ceilingmeasure.NativeHomeExpressiveUiTest ru.xalidmuslim.ceilingmeasure.preview.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/v270-tests.log
            grep -Eq '^OK \([0-9]+ tests?\)' /tmp/v270-tests.log
            adb install -r app/build/outputs/apk/releasePreview/app-releasePreview.apk
            adb shell am start -W -n ru.xalidmuslim.ceilingmeasure.smooth270/ru.xalidmuslim.ceilingmeasure.NativeHomeActivity
            adb logcat -d -s AndroidRuntime:E > /tmp/v270-crashes.log
            ! grep -q 'FATAL EXCEPTION' /tmp/v270-crashes.log

  publish-v270:
    name: Public direct APK in GitHub Releases
    needs: test-build-preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CeilingMeasure-v270-section-swipe
          path: release
      - name: Verify APK
        run: |
          set -euo pipefail
          test -s release/app-releasePreview.apk
          mv release/app-releasePreview.apk release/Zamer-v270.apk
          sha256sum release/Zamer-v270.apk
      - name: Publish v270 preview APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zamer-v270-preview
          target_commitish: ${{ github.sha }}
          name: "Замер потолков v270 — два режима навигации и быстрый монтаж потолка"
          prerelease: true
          draft: false
          fail_on_unmatched_files: true
          files: release/Zamer-v270.apk
          body: |
            Тестовая Android APK (native Java, R8), ставится отдельно как .smooth270.
            Нижняя навигация: динамическая или постоянная, выбор сохраняется; анимации прежние.
            Синяя карточка: без центрального трека, при нажатии быстрый монтаж 320 мс, переход через 320 мс. На видимой главной — автоматический цикл монтажа 6000 мс + пауза 1150 мс с полной остановкой в фоне, на другом разделе и при скролле за пределы экрана. При касании быстрый цикл приоритетнее фонового.
            Обзор всех комнат: выровненные колонки Комната | Площадь | Периметр,
            компактный итог по всему объекту и сохранение точных расчётов.
            В заказе, комнатах и общей сводке плавное расширение и сворачивание
            с одинаковой анимацией высоты и прозрачности (245 мс).
            Три блока управляются касанием заголовка с шевроном.
            Свайп налево/направо переключает комнаты в закрытом чертеже
            только при начале движения на свободном месте, без перехвата
            рисования стен, перетаскивания точек и редактирования цифр.
            Для незавершённого чертежа свайп работает по его заголовку.
            Все расчёты, данные и предыдущая анимация монтажа сохранены.
            Последние замеры: последовательный вход при каждом возвращении на главную
            без перезагрузки неизменных данных.
            Исправления смет и кнопки «Ещё» из v264 сохранены.
            Успешное тестирование на Android 15 Emulator подтверждается workflow.
            Реальное устройство и частота кадров на нём пока не измерялись.
