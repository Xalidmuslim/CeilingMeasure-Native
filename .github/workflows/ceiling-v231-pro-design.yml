name: CeilingMeasure v231 Professional Design APK
on:
  push:
    branches:
      - feature/pro-design-system-v231
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ceiling-v231-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android lint, unit tests and instrumentation compile
        run: gradle --no-daemon clean lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Unit test reports and runner self-test
        run: |
          bash scripts/test_run_android_smoke.sh
          test -s app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CeilingMeasure-v231-professional-design-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
