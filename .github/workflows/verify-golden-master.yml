name: Verify native Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify restored web golden master
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_webapp.py webapp/index.html
          echo "354fbede167490d2481d3253507ff2829dcefec495298075487880ea2258a388  webapp/index.html" | sha256sum -c -

      - name: Verify native-only architecture
        shell: bash
        run: |
          set -euo pipefail
          test ! -f app/src/main/assets/index.html
          test ! -f app/src/main/java/ru/xalidmuslim/ceilingmeasure/MainActivity.java
          test -f app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeHomeActivity.java
          test -f app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeWorkspaceActivity.java
          test -f app/src/main/java/ru/xalidmuslim/ceilingmeasure/CeilingDrawingView.java
          test -f app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeProjectStore.java

          if grep -R -E "android\.webkit\.WebView|androidx\.webkit" app/src/main/java app/build.gradle; then
            echo "WebView/WebKit is not allowed in the native application"
            exit 1
          fi

          grep -q 'android:name=".NativeHomeActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".NativeWorkspaceActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android.intent.category.LAUNCHER' app/src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build corrected native APK
        run: gradle --no-daemon clean lintDebug testDebugUnitTest assembleDebug

      - name: Verify corrected APK stays native-only
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          if unzip -l "$APK" | grep -q 'assets/index.html'; then
            echo "FAIL: HTML asset is packaged in native APK"
            exit 1
          fi
          if unzip -l "$APK" | grep -q 'MainActivity'; then
            echo "FAIL: legacy wrapper activity found"
            exit 1
          fi

      - name: Upload corrected native APK
        uses: actions/upload-artifact@v4
        with:
          name: CeilingMeasure-native-full-fix-v217
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Run corrected native Android instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash scripts/run_android_smoke.sh

