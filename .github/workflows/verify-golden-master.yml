name: Verify native Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify restored web golden master
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_webapp.py webapp/index.html
          echo "354fbede167490d2481d3253507ff2829dcefec495298075487880ea2258a388  webapp/index.html" | sha256sum -c -

      - name: Verify native-only architecture
        shell: bash
        run: |
          set -euo pipefail
          test ! -f app/src/main/assets/index.html
          test ! -f app/src/main/java/ru/xalidmuslim/ceilingmeasure/MainActivity.java
          test -f app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeHomeActivity.java
          test -f app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeWorkspaceActivity.java
          test -f app/src/main/java/ru/xalidmuslim/ceilingmeasure/CeilingDrawingView.java
          test -f app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeProjectStore.java

          if grep -R -E "android\.webkit\.WebView|androidx\.webkit" app/src/main/java app/build.gradle; then
            echo "WebView/WebKit is not allowed in the native application"
            exit 1
          fi

          grep -q 'android:name=".NativeHomeActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".NativeWorkspaceActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android.intent.category.LAUNCHER' app/src/main/AndroidManifest.xml
