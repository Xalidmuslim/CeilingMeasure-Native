name: CeilingMeasure v233 Navigation and Label Editing

on:
  push:
    branches:
      - fix/v233-navigation-label-rooms-estimate-fade
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceiling-v233-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-preview-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Lint, unit tests, APK and Android instrumentation compile
        run: gradle --no-daemon clean lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Verify smoke runner and APK contents
        run: |
          set -euo pipefail
          bash scripts/test_run_android_smoke.sh
          test -s app/build/outputs/apk/debug/app-debug.apk
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.html'; then
            echo "ERROR: Legacy WebView content packaged"
            exit 1
          fi
      - name: Upload v233 preview APK
        uses: actions/upload-artifact@v4
        with:
          name: CeilingMeasure-v233-label-menu-nav-layout-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
