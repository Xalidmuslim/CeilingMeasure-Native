name: Import Arabic Grammar Selected Icon

on:
  push:
    branches:
      - feature/arabic-grammar-app-2026-10-03
    paths:
      - '.github/workflows/import-arabic-grammar-icon.yml'

permissions:
  contents: write

jobs:
  import-icon:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feature/arabic-grammar-app-2026-10-03
          fetch-depth: 0

      - name: Download selected icon
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            'https://84ac8838-5d27-46f9-9d8c-015e2d61f603.sandbox.floot.app/_cdn/static/5a2fc4a7-efbe-47c1-a315-964538fd0afc-arabic_grammar_selected_icon.png' \
            -o /tmp/selected-icon
          test -s /tmp/selected-icon
          file /tmp/selected-icon

      - name: Convert to Android launcher PNG
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          mkdir -p ArabicGrammarApp/app/src/main/res/drawable-nodpi
          convert /tmp/selected-icon \
            -resize 512x512 \
            -strip \
            -colorspace sRGB \
            ArabicGrammarApp/app/src/main/res/drawable-nodpi/app_icon_selected.png
          test -s ArabicGrammarApp/app/src/main/res/drawable-nodpi/app_icon_selected.png
          file ArabicGrammarApp/app/src/main/res/drawable-nodpi/app_icon_selected.png

      - name: Commit exact selected icon
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ArabicGrammarApp/app/src/main/res/drawable-nodpi/app_icon_selected.png
          if git diff --cached --quiet; then
            echo "Icon already embedded"
            exit 0
          fi
          git commit -m "ArabicGrammar: embed selected 3D launcher icon"
          git push origin HEAD:feature/arabic-grammar-app-2026-10-03
