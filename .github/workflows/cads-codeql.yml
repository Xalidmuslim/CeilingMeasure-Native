name: CADS CodeQL Security

on:
  pull_request:
  push:
    branches:
      - main
      - feature/v270-auto-ceiling-installation
  schedule:
    - cron: '12 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  codeql:
    name: CADS CodeQL security
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Current project is native Java. CodeQL's none mode analyzes Java without compiling.
      # Revisit build-mode if Kotlin or generated sources are added.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: none
          queries: security-extended
      - name: Analyze security alerts
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
