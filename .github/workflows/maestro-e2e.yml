name: Maestro Android E2E
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.maestro/**'
      - 'app/**'
      - '.github/workflows/maestro-e2e.yml'

permissions:
  contents: read

concurrency:
  group: ceiling-maestro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Use runner Android SDK (without deprecated tools package)
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build existing native debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Install Maestro CLI
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test installed APK on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: |
            set -euo pipefail
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            maestro test .maestro 2>&1 | tee maestro-output.log
      - name: Upload Maestro logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ceiling-maestro-logs
          path: maestro-output.log
          if-no-files-found: ignore
