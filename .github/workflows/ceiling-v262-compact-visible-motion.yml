name: CeilingMeasure v262 Compact Overview and Visible Motion

on:
  push:
    branches: [feature/v262-compact-overview-visible-navigation]
  pull_request:
    branches: [feature/v261-fast-ordinary-navigation]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceiling-v262-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit regression tests, lint and v262 preview APK
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleReleasePreview
          test -s app/build/outputs/apk/releasePreview/app-releasePreview.apk
          sha256sum app/build/outputs/apk/releasePreview/app-releasePreview.apk
      - name: Upload direct-APK source artifact
        uses: actions/upload-artifact@v4
        with:
          name: CeilingMeasure-v262-compact-visible-motion-apk
          path: app/build/outputs/apk/releasePreview/app-releasePreview.apk
          if-no-files-found: error
          retention-days: 30
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 button and settings regression tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-boot-timeout: 600
          script: |
            set -eu
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class ru.xalidmuslim.ceilingmeasure.NativeCompactOverviewMotionTest,ru.xalidmuslim.ceilingmeasure.NativeFastNavigationAndOrdinaryDialogsTest,ru.xalidmuslim.ceilingmeasure.NativeTransformerMotionTest,ru.xalidmuslim.ceilingmeasure.NativeTransformerModeTest,ru.xalidmuslim.ceilingmeasure.NativeUiMotionSettingsTest,ru.xalidmuslim.ceilingmeasure.NativeHomeExpressiveUiTest,ru.xalidmuslim.ceilingmeasure.NativeProjectOverviewUiTest ru.xalidmuslim.ceilingmeasure.preview.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/page-motion-tests.txt
            grep -Eq '^OK \([0-9]+ tests?\)' /tmp/page-motion-tests.txt
            adb install -r app/build/outputs/apk/releasePreview/app-releasePreview.apk
            adb shell am start -W -n ru.xalidmuslim.ceilingmeasure.smooth262/ru.xalidmuslim.ceilingmeasure.NativeHomeActivity
            adb logcat -d -s AndroidRuntime:E | tee /tmp/page-motion-errors.txt
            if grep -q 'FATAL EXCEPTION' /tmp/page-motion-errors.txt; then exit 1; fi
