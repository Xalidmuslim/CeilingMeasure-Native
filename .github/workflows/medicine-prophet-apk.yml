name: Build Medicine Prophet APK

on:
  push:
    branches:
      - medicine-prophet-apk-build
    paths:
      - "medicine-prophet-apk/**"
      - ".github/workflows/medicine-prophet-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android platform
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path "*/bin/sdkmanager" | sort -V | tail -1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        working-directory: medicine-prophet-apk
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        run: |
          cp medicine-prophet-apk/app/build/outputs/apk/debug/app-debug.apk medicina-proroka.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs medicina-proroka.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging medicina-proroka.apk | grep -E "^package:|application-label|sdkVersion|targetSdkVersion"
          sha256sum medicina-proroka.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: medicina-proroka-apk
          path: medicina-proroka.apk
          if-no-files-found: error
          retention-days: 30
