name: CeilingMeasure v256 Transformer Motion

on:
  push:
    branches: [feature/v256-transformer-motion]
  pull_request:
    branches: [fix/v255-smooth-drawing-entry-closed-contour-only]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceiling-v256-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: JVM motion contract, existing tests, Android lint and APK
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleReleasePreview
      - name: Check isolated optimized v256 preview
        run: |
          test -s app/build/outputs/apk/releasePreview/app-releasePreview.apk
          test -s app/build/outputs/mapping/releasePreview/mapping.txt
          sha256sum app/build/outputs/apk/releasePreview/app-releasePreview.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 transformer gesture instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-boot-timeout: 600
          script: |
            set -eu
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class ru.xalidmuslim.ceilingmeasure.NativeTransformerMotionTest ru.xalidmuslim.ceilingmeasure.preview.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/transformer-test.txt
            grep -q 'OK (1 test)' /tmp/transformer-test.txt
            adb install -r app/build/outputs/apk/releasePreview/app-releasePreview.apk
            adb shell am start -W -n ru.xalidmuslim.ceilingmeasure.smooth256/ru.xalidmuslim.ceilingmeasure.NativeHomeActivity
            adb logcat -d -s AndroidRuntime:E | tee /tmp/transformer-errors.txt
            if grep -q 'FATAL EXCEPTION' /tmp/transformer-errors.txt; then exit 1; fi
      - name: Upload preview APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CeilingMeasure-v256-transformer-preview
          path: app/build/outputs/apk/releasePreview/app-releasePreview.apk
          if-no-files-found: error
          retention-days: 30
