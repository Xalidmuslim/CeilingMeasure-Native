name: CeilingMeasure v263 Aligned Metrics and Smooth Dialog Exit

on:
  push:
    branches: [feature/v263-aligned-room-metrics-smooth-dialog-exit]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceiling-v263-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: JVM regression, lint and optimized APK
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleReleasePreview
          test -s app/build/outputs/apk/releasePreview/app-releasePreview.apk
          sha256sum app/build/outputs/apk/releasePreview/app-releasePreview.apk
      - name: Upload v263 direct APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CeilingMeasure-v263-aligned-smooth-exit
          path: app/build/outputs/apk/releasePreview/app-releasePreview.apk
          if-no-files-found: error
          retention-days: 30
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 project grid and dialog navigation regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-boot-timeout: 600
          script: |
            set -eu
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class ru.xalidmuslim.ceilingmeasure.NativeProjectOverviewUiTest,ru.xalidmuslim.ceilingmeasure.NativeCompactOverviewMotionTest,ru.xalidmuslim.ceilingmeasure.NativeEstimateFullScreenNavigationTest,ru.xalidmuslim.ceilingmeasure.NativeFastNavigationAndOrdinaryDialogsTest,ru.xalidmuslim.ceilingmeasure.NativePriceDragUiTest ru.xalidmuslim.ceilingmeasure.preview.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/v263-tests.log
            grep -Eq '^OK \([0-9]+ tests?\)' /tmp/v263-tests.log
            adb install -r app/build/outputs/apk/releasePreview/app-releasePreview.apk
            adb shell am start -W -n ru.xalidmuslim.ceilingmeasure.smooth263/ru.xalidmuslim.ceilingmeasure.NativeHomeActivity
            adb logcat -d -s AndroidRuntime:E > /tmp/v263-crashes.log
            ! grep -q 'FATAL EXCEPTION' /tmp/v263-crashes.log

  publish-v263:
    name: Public direct APK in GitHub Releases
    needs: test-build-preview
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CeilingMeasure-v263-aligned-smooth-exit
          path: release
      - name: Verify APK
        run: |
          set -euo pipefail
          test -s release/app-releasePreview.apk
          mv release/app-releasePreview.apk release/Zamer-v263.apk
          sha256sum release/Zamer-v263.apk
      - name: Publish v263 preview APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zamer-v263-preview
          target_commitish: ${{ github.sha }}
          name: "Замер потолков v263 — выровненные столбцы и плавное закрытие"
          prerelease: true
          draft: false
          fail_on_unmatched_files: true
          files: release/Zamer-v263.apk
          body: |
            Тестовая Android APK (native Java, R8), ставится отдельно как .smooth263.
            Обзор всех комнат: выровненные колонки Комната | Площадь | Периметр,
            компактный итог по всему объекту и сохранение точных расчётов.
            Смета клиента и закупочный прайс: одно лёгкое затухание при выходе,
            без двойной анимации окна и одновременной перерисовки сметы.
            Успешное тестирование на Android 15 Emulator подтверждается workflow.
            Реальное устройство и частота кадров на нём пока не измерялись.
