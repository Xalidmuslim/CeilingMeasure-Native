name: CeilingMeasure v237 Compact Estimate APK

on:
  push:
    branches:
      - design/v237-compact-readable-estimate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceiling-v237-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Lint, unit tests, Android UI test compile, APK
        run: gradle --no-daemon clean lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Verify APK and smoke runner
        run: |
          set -euo pipefail
          bash scripts/test_run_android_smoke.sh
          test -s app/build/outputs/apk/debug/app-debug.apk
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.html'; then
            echo "Unexpected legacy WebView assets"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: CeilingMeasure-v237-compact-estimate-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
