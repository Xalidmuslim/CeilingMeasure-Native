name: CeilingMeasure v234 Persistent Navigation and Fade APK

on:
  push:
    branches:
      - fix/v234-persistent-navigation-back-fade
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceiling-v234-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Lint, unit tests, build and instrumentation compile
        run: gradle --no-daemon clean lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Validate binary and Android runner
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          bash scripts/test_run_android_smoke.sh
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.html'; then
            echo "Unexpected web legacy content bundled"
            exit 1
          fi
      - name: Publish preview v234 APK
        uses: actions/upload-artifact@v4
        with:
          name: CeilingMeasure-v234-persistent-nav-back-fade-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
