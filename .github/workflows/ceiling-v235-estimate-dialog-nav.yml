name: CeilingMeasure v235 Estimate Dock and Compact Layout APK

on:
  push:
    branches:
      - fix/v235-estimate-dialog-navigation-system-bars
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceiling-v235-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Lint, JUnit, Android test compile, debug APK
        run: gradle --no-daemon clean lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Validate APK and instrumentation runner
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          bash scripts/test_run_android_smoke.sh
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.html'; then
            echo "Unexpected legacy WebView content"
            exit 1
          fi
      - name: Upload v235 preview APK
        uses: actions/upload-artifact@v4
        with:
          name: CeilingMeasure-v235-estimate-price-fixed-nav-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
