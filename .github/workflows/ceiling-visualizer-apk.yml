name: Ceiling Visualizer APK

on:
  push:
    branches:
      - ceiling-visualizer-apk-build
    paths:
      - 'visualizer-build/**'
      - '.github/workflows/ceiling-visualizer-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceiling-visualizer-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle -p visualizer-build --no-daemon clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=visualizer-build/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          echo "APK_BYTES=$(stat -c%s "$APK")"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CeilingVisualizer-v0.1-debug
          path: visualizer-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
