name: Ceiling Visualizer APK

on:
  push:
    branches:
      - ceiling-visualizer-apk-build
    paths:
      - 'visualizer-build/**'
      - '.github/workflows/ceiling-visualizer-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceiling-visualizer-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare fixture QA assets
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pillow
          python visualizer-build/scripts/prepare_fixture_assets.py

      - name: Upload fixture QA
        uses: actions/upload-artifact@v4
        with:
          name: CeilingVisualizer-Fixture-QA
          path: visualizer-build/generated-fixtures/
          if-no-files-found: error
          retention-days: 7

      - name: Embed approved fixtures
        shell: bash
        run: |
          set -euo pipefail
          RES=visualizer-build/app/src/main/res/drawable-nodpi
          mkdir -p "$RES"
          cp visualizer-build/generated-fixtures/spot_white.png "$RES/spot_white.png"
          cp visualizer-build/generated-fixtures/spot_black.png "$RES/spot_black.png"
          cp visualizer-build/generated-fixtures/ring_black.png "$RES/ring_black.png"
          cp visualizer-build/generated-fixtures/three_globes.png "$RES/three_globes.png"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle -p visualizer-build --no-daemon clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=visualizer-build/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'classes.dex'
          echo "APK_BYTES=$(stat -c%s "$APK")"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CeilingVisualizer-v0.8-debug
          path: visualizer-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
