name: Expense Tracker Native APK

on:
  push:
    branches:
      - build/expense-tracker-native-v1
    paths:
      - 'expense-native/**'
      - '.github/workflows/expense-native-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: expense-native
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-native-debug
          path: expense-native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
