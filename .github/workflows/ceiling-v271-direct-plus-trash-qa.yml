name: v271 Direct Plus and Trash QA

on:
  push:
    branches: [feature/v271-direct-plus-trash-material-order]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceiling-v271-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: JVM tests, lint, and debug artifacts
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 15 direct plus, trash, and autosave UI regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -r -e class ru.xalidmuslim.ceilingmeasure.NativeHomeExpressiveUiTest,ru.xalidmuslim.ceilingmeasure.NativeTrashUiTest,ru.xalidmuslim.ceilingmeasure.NativeDrawingBackAutosaveTest,ru.xalidmuslim.ceilingmeasure.NativeHomeAndSavedNavigationTest ru.xalidmuslim.ceilingmeasure.preview.test/androidx.test.runner.AndroidJUnitRunner | tee /tmp/v271-ui.log
            grep -Eq '^OK \([0-9]+ tests?\)' /tmp/v271-ui.log
      - name: Save UI regression output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ceiling-v271-ui-log
          path: /tmp/v271-ui.log
          if-no-files-found: ignore
          retention-days: 14
