name: CADS Dependency Security Review

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: CADS Dependency Review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject high and critical known vulnerabilities introduced by changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
