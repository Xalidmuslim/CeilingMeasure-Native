name: CeilingMeasure v243 Optimized R8 Release

on:
  push:
    branches:
      - perf/v243-r8-cold-start-home
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceiling-v243-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Lint, unit tests, instrumentation compilation, R8 release builds
        run: >
          gradle --no-daemon clean lintDebug testDebugUnitTest
          assembleDebugAndroidTest assembleRelease assembleReleasePreview
      - name: Assert R8 mapping and optimized build
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/releasePreview/app-releasePreview.apk
          test -s app/build/outputs/mapping/releasePreview/mapping.txt
          test -s app/build/outputs/mapping/release/mapping.txt
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          if unzip -l app/build/outputs/apk/releasePreview/app-releasePreview.apk | grep -q 'assets/index.html'; then
            echo 'Legacy WebView asset found inside native release' >&2
            exit 1
          fi
          sha256sum app/build/outputs/apk/releasePreview/app-releasePreview.apk
          ls -lh app/build/outputs/apk/release*/app*.apk
      - name: Upload R8-optimized installable preview
        uses: actions/upload-artifact@v4
        with:
          name: CeilingMeasure-v243-R8-release-preview
          path: app/build/outputs/apk/releasePreview/app-releasePreview.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload R8 mapping for diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: CeilingMeasure-v243-R8-mapping
          path: |
            app/build/outputs/mapping/releasePreview/mapping.txt
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 30

  emulator-performance:
    needs: release-verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Download optimized release preview APK
        uses: actions/download-artifact@v4
        with:
          name: CeilingMeasure-v243-R8-release-preview
          path: build/release-preview
      - name: Exercise cold start, scrolling and settings on Android API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: false
          emulator-boot-timeout: 600
          script: bash scripts/test_v243_optimized_release.sh build/release-preview/app-releasePreview.apk
      - name: Upload performance measurements and UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CeilingMeasure-v243-emulator-performance
          path: build/v243-performance/
          if-no-files-found: warn
          retention-days: 30
