name: CeilingMeasure v241 Restore One-Row Estimate

on:
  push:
    branches:
      - fix/v241-one-row-center-only
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceiling-v241-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Lint, unit tests, Android test compilation, APK
        run: gradle --no-daemon clean lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Check APK and smoke runner
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          bash scripts/test_run_android_smoke.sh
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.html'; then
            echo "Unexpected legacy WebView content packaged"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: CeilingMeasure-v241-one-row-centered-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
