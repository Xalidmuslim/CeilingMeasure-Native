name: CeilingMeasure v236 Drawing Frame Performance APK
on:
  push:
    branches:
      - perf/v236-drawing-frame-efficiency
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceiling-v236-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Lint, unit tests, instrumented test compilation and APK
        run: gradle --no-daemon clean lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Verify native APK and Android smoke runner
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          bash scripts/test_run_android_smoke.sh
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.html'; then
            echo "Unexpected legacy WebView assets"
            exit 1
          fi
      - name: Publish v236 preview APK
        uses: actions/upload-artifact@v4
        with:
          name: CeilingMeasure-v236-drawing-frame-performance-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
