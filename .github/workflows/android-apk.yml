name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify golden master
        run: |
          python scripts/verify_webapp.py webapp/index.html
          python scripts/verify_webapp.py app/src/main/assets/index.html
          test "$(sha256sum webapp/index.html | cut -d' ' -f1)" = "$(sha256sum app/src/main/assets/index.html | cut -d' ' -f1)"

      - name: Lint, unit tests, assemble
        run: gradle --no-daemon clean lintDebug testDebugUnitTest assembleDebug

      - name: Verify packaged web asset and manifest
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"

          unzip -p "$APK" assets/index.html > /tmp/index-from-apk.html
          EXPECTED=e6688f9c45f620753bbb1fc023544adee99ba1631f99586a97d58d4517ec668c
          ACTUAL="$(sha256sum /tmp/index-from-apk.html | cut -d' ' -f1)"
          echo "APK asset SHA-256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          APK_ANALYZER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/apkanalyzer' 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$APK_ANALYZER" ]; then
            echo "apkanalyzer was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi

          PERMS="$("$APK_ANALYZER" manifest permissions "$APK")"
          echo "$PERMS"
          if echo "$PERMS" | grep -q "android.permission.INTERNET"; then
            echo "Unexpected INTERNET permission"
            exit 1
          fi

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CeilingMeasure-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Run Android instrumentation smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash scripts/run_android_smoke.sh

      - name: Re-verify golden asset after tests
        run: |
          python scripts/verify_webapp.py app/src/main/assets/index.html
          test "$(sha256sum app/src/main/assets/index.html | cut -d' ' -f1)" = "e6688f9c45f620753bbb1fc023544adee99ba1631f99586a97d58d4517ec668c"
