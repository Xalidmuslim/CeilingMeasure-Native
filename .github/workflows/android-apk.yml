name: Android APK

on:
  push:
    branches: [ main, fix/native-full-app-2026-09-29 ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify web golden master for parity audit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_webapp.py webapp/index.html
          echo "354fbede167490d2481d3253507ff2829dcefec495298075487880ea2258a388  webapp/index.html" | sha256sum -c -

      - name: Verify native-only source
        shell: bash
        run: |
          set -euo pipefail
          test ! -f app/src/main/assets/index.html
          test ! -f app/src/main/java/ru/xalidmuslim/ceilingmeasure/MainActivity.java
          if grep -R -E "android\.webkit\.WebView|androidx\.webkit" app/src/main/java app/build.gradle; then
            echo "Legacy WebView dependency found in native application source"
            exit 1
          fi
          grep -q 'android:name=".NativeHomeActivity"' app/src/main/AndroidManifest.xml
          grep -q 'android:name=".NativeWorkspaceActivity"' app/src/main/AndroidManifest.xml
          grep -q 'class CeilingDrawingView' app/src/main/java/ru/xalidmuslim/ceilingmeasure/CeilingDrawingView.java
          grep -q 'class NativeGeometry' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeGeometry.java
          grep -q 'class EdgeData' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeProjectStore.java
          grep -q 'cycleOrder' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeGeometry.java
          grep -q 'WallDraft' app/src/main/java/ru/xalidmuslim/ceilingmeasure/CeilingDrawingView.java
          grep -q 'repairOvershotClosedContour' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeGeometry.java
          grep -q 'extendStraightWall' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeGeometry.java
          grep -q 'drawMagnifierOverlay' app/src/main/java/ru/xalidmuslim/ceilingmeasure/CeilingDrawingView.java
          grep -q 'onVertexLongPressed' app/src/main/java/ru/xalidmuslim/ceilingmeasure/CeilingDrawingView.java
          grep -q 'class NativeEstimateEngine' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeEstimateEngine.java
          grep -q 'class NativeEstimateDialog' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeEstimateDialog.java
          grep -q 'class NativeClientEstimatePdf' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeClientEstimatePdf.java
          grep -q 'native_client_pdf' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeEstimateDialog.java
          grep -q 'class NativePricePresetDialog' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativePricePresetDialog.java
          grep -q 'class NativeMaterialEditorDialog' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeMaterialEditorDialog.java
          grep -q 'combinedEstimateOrderIds' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeProjectStore.java
          grep -q 'class NativeMeasurementSolver' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeMeasurementSolver.java
          grep -q 'exactRectAreaRaw' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeMeasurementSolver.java
          grep -q 'solveOrthogonal' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeMeasurementSolver.java
          grep -q 'class NativeLabelEngine' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeLabelEngine.java
          grep -q 'placeWall' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeLabelEngine.java
          grep -q 'class NativeMeasurementValidator' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeMeasurementValidator.java
          grep -q 'drawLabelSelection' app/src/main/java/ru/xalidmuslim/ceilingmeasure/CeilingDrawingView.java
          grep -q 'class NativeDrawToolsDialog' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeDrawToolsDialog.java
          grep -q 'native_draw_tool_' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeDrawToolsDialog.java
          grep -q 'vibrateSnap' app/src/main/java/ru/xalidmuslim/ceilingmeasure/CeilingDrawingView.java
          grep -q 'beginPinch' app/src/main/java/ru/xalidmuslim/ceilingmeasure/CeilingDrawingView.java
          grep -q 'applyPinch' app/src/main/java/ru/xalidmuslim/ceilingmeasure/CeilingDrawingView.java
          grep -q 'pageScrollActive' app/src/main/java/ru/xalidmuslim/ceilingmeasure/CeilingDrawingView.java
          grep -q 'native_wall_scroll_strip' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeWorkspaceActivity.java
          grep -q 'native_history_nav' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeWorkspaceActivity.java
          grep -q 'class NativeRoomPickerDialog' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeRoomPickerDialog.java
          grep -q 'class NativeUiPrefs' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeUiPrefs.java
          grep -q 'exportBackup' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeProjectStore.java
          grep -q 'native_saved_search' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeWorkspaceActivity.java
          grep -q 'class NativeWallMeasureDialog' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeWallMeasureDialog.java
          grep -q 'class NativeDiagonalMeasureDialog' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeDiagonalMeasureDialog.java
          grep -q 'autoDiagonalValue' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeMeasurementSolver.java
          grep -q 'class NativeNumberPadDialog' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeNumberPadDialog.java
          grep -q 'native_number_pad_' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeNumberPadDialog.java
          grep -q 'class NativeTextPadDialog' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeTextPadDialog.java
          grep -q 'native_text_pad_' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeTextPadDialog.java
          grep -q 'addRow(keypad, ",", "0", "⌫")' app/src/main/java/ru/xalidmuslim/ceilingmeasure/NativeNumberPadDialog.java

      - name: Capture Phase 2 web golden reference screenshots
        shell: bash
        run: bash scripts/capture_phase2_web_refs.sh

      - name: Upload Phase 2 web references
        uses: actions/upload-artifact@v4
        with:
          name: CeilingMeasure-phase2-web-reference
          path: build/phase2-web-reference
          if-no-files-found: error
          retention-days: 30

      - name: Lint, unit tests, assemble
        run: gradle --no-daemon clean lintDebug testDebugUnitTest assembleDebug

      - name: Verify native APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"

          if unzip -l "$APK" | grep -q 'assets/index.html'; then
            echo "Legacy HTML asset is still packaged in the APK"
            exit 1
          fi

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          APK_ANALYZER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/apkanalyzer' 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$APK_ANALYZER" ]; then
            echo "apkanalyzer was not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi

          PERMS="$("$APK_ANALYZER" manifest permissions "$APK")"
          echo "$PERMS"
          if echo "$PERMS" | grep -q "android.permission.INTERNET"; then
            echo "Unexpected INTERNET permission"
            exit 1
          fi

          MANIFEST="$("$APK_ANALYZER" manifest print "$APK")"
          echo "$MANIFEST" | grep -q 'ru.xalidmuslim.ceilingmeasure.NativeHomeActivity'
          echo "$MANIFEST" | grep -q 'android.intent.category.LAUNCHER'

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CeilingMeasure-native-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Run Android instrumentation smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash scripts/run_android_smoke.sh

      - name: Run Phase 2 API 35 shell, inset, width and screenshot evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash scripts/run_phase2_shell_evidence.sh

      - name: Upload Phase 2 native screenshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: CeilingMeasure-phase2-native-screenshots
          path: build/phase2-native-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Re-verify native source after tests
        shell: bash
        run: |
          set -euo pipefail
          test ! -f app/src/main/assets/index.html
          test ! -f app/src/main/java/ru/xalidmuslim/ceilingmeasure/MainActivity.java
          if grep -R -E "android\.webkit\.WebView|androidx\.webkit" app/src/main/java app/build.gradle; then
            exit 1
          fi
