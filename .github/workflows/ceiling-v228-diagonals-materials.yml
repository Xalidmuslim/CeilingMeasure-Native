name: CeilingMeasure v228 Room Materials and Diagonal Labels APK

on:
  push:
    branches:
      - feature/room-material-diagonal-labels-v228
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceiling-v228-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Lint, unit tests, APK and UI test compile
        run: gradle --no-daemon clean lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Verify installable preview APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.html'; then
            echo "Unexpected legacy WebView asset"; exit 1
          fi
      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: CeilingMeasure-v228-diagonal-material-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
