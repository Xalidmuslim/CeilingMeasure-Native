name: Export TEST v190

on:
  push:
    paths:
      - ".github/workflows/export-test-v190.yml"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: test-v190-html
          path: webapp/test_v190.html
          if-no-files-found: error
          retention-days: 1
