name: CeilingMeasure v242 Premium Native Home

on:
  push:
    branches:
      - design/v242-premium-native-home
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ceiling-v242-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate native UI and build installable APK
        run: gradle --no-daemon clean lintDebug testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - name: Verify artifact and legacy UI isolation
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          bash scripts/test_run_android_smoke.sh
          if unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/index.html'; then
            echo "Unexpected WebView asset included in native APK"
            exit 1
          fi
      - name: Upload Android preview APK
        uses: actions/upload-artifact@v4
        with:
          name: CeilingMeasure-v242-premium-native-home-preview
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
