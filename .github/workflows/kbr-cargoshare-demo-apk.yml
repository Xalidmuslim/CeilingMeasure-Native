name: KBR CargoShare APK demo
on:
  push:
    branches:
      - codex/kbr-cargoshare-v098-reliable-gps
    paths:
      - 'kbr-cargoshare-demo/**'
      - '.github/workflows/kbr-cargoshare-demo-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify exact bundled demo vehicle images before signing
        run: |
          set -euo pipefail
          cd kbr-cargoshare-demo/android/app/src/main/assets
          cat <<'IMAGE_CHECKS' | sha256sum -c -
          8e896e30bb3527a9fbd0a667cc176821b4dacaab9639ff31ff5e625e5e353f16  truck_g01.webp
          92ceb655688d9328963d776b907ff33ac05e939a19ab334d1889ebbfbc14d54e  truck_g02.webp
          d5caebdf38494b1af0b1fd5914dd7bea01f3ddf99ba3d5b6e76b4d662e23fc9e  truck_g03.webp
          IMAGE_CHECKS
          for i in 01 02 03; do
            test "$(file --mime-type --brief "truck_g${i}.webp")" = "image/webp"
          done
      - name: Build installable APK
        working-directory: kbr-cargoshare-demo/android
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Verify installable APK signature and alignment
        run: |
          set -euo pipefail
          APK=kbr-cargoshare-demo/android/app/build/outputs/apk/debug/app-debug.apk
          SDK_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$SDK_BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$SDK_BUILD_TOOLS/aapt" dump badging "$APK" | head -10
          test "$(stat -c%s "$APK")" -gt 1000000
      - name: Verify all three new truck images are present in signed APK
        run: |
          set -euo pipefail
          APK=kbr-cargoshare-demo/android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p /tmp/gruzsher-apk-photos
          for i in 01 02 03; do
            unzip -p "$APK" "assets/truck_g${i}.webp" > "/tmp/gruzsher-apk-photos/truck_g${i}.webp"
          done
          cd /tmp/gruzsher-apk-photos
          cat <<'IMAGE_CHECKS' | sha256sum -c -
          8e896e30bb3527a9fbd0a667cc176821b4dacaab9639ff31ff5e625e5e353f16  truck_g01.webp
          92ceb655688d9328963d776b907ff33ac05e939a19ab334d1889ebbfbc14d54e  truck_g02.webp
          d5caebdf38494b1af0b1fd5914dd7bea01f3ddf99ba3d5b6e76b4d662e23fc9e  truck_g03.webp
          IMAGE_CHECKS
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GruzSher-KBR-v0.9.8-Reliable-GPS-APK
          path: kbr-cargoshare-demo/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
