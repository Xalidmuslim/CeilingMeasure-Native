name: KBR CargoShare APK demo
on:
  push:
    branches:
      - codex/kbr-cargoshare-v07-premium-ux
    paths:
      - 'kbr-cargoshare-demo/**'
      - '.github/workflows/kbr-cargoshare-demo-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download freely licensed demo truck photos
        run: |
          mkdir -p kbr-cargoshare-demo/android/app/src/main/assets
          cd kbr-cargoshare-demo/android/app/src/main/assets
          urls=(
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/Moscow%2C_Gazelle_Next_box_truck%2C_Sept_2025_01.jpg?width=640"
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/Moscow%2C_Gazelle_Next_box_truck%2C_Aug_2025_01.jpg?width=640"
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/Moscow%2C_Gazelle_Next_white_van%2C_May_2026_01.jpg?width=640"
          )
          for i in 0 1 2; do
            n=$(printf 'truck_g%02d.jpg' "$((i+1))")
            curl -L --retry 1 --connect-timeout 8 --max-time 25 -f -sS -A "GruzSherKBR/0.7 (CC0 demo photos)" "${urls[$i]}" -o "$n" || rm -f "$n"
            if [ -f "$n" ] && ! file --mime-type "$n" | grep -q 'image/jpeg'; then rm -f "$n"; fi
            if [ -f "$n" ]; then echo "CC0 image $n downloaded"; else echo "Offline image fallback: $n"; fi
          done
      - name: Build installable APK
        working-directory: kbr-cargoshare-demo/android
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GruzSher-KBR-v0.7-Premium-UX-APK
          path: kbr-cargoshare-demo/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
