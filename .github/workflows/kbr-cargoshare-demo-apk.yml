name: KBR CargoShare APK demo
on:
  push:
    branches:
      - codex/kbr-cargoshare-android-apk-20261017
    paths:
      - 'kbr-cargoshare-demo/**'
      - '.github/workflows/kbr-cargoshare-demo-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        working-directory: kbr-cargoshare-demo/android
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GruzSher-KBR-demo-v0.2-APK
          path: kbr-cargoshare-demo/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
