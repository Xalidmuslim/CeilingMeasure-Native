plugins { id 'com.android.application' }

android {
    namespace 'com.xalid.ceilingvisualizer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xalid.ceilingvisualizer'
        minSdk 28
        targetSdk 35
        versionCode 8
        versionName '0.8.0'
    }

    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
