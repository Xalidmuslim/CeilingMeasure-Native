name = "ceilingmeasure-license"
main = "src/worker.mjs"
compatibility_date = "2026-09-01"

# Free hostname after deployment: https://ceilingmeasure-license.<account>.workers.dev
workers_dev = true


# Optional public checkout links. Leave empty until seller products have passed
# moderation and payment account has been verified.
[vars]
MONTHLY_PRICE_RUB = "299"
LIFETIME_PRICE_RUB = "2990"
PAYMENT_MONTH_URL = ""
PAYMENT_LIFETIME_URL = ""

[[d1_databases]]
binding = "DB"
database_name = "ceilingmeasure-licenses"
database_id = "REPLACE_WITH_ACTUAL_D1_DATABASE_ID"
migrations_dir = "migrations"
