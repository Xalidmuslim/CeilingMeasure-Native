name = "ceilingmeasure-license"
main = "src/worker.mjs"
compatibility_date = "2026-09-01"

# Free hostname after deployment: https://ceilingmeasure-license.<account>.workers.dev
workers_dev = true


# Public contact details (no bank-card data or transfer credentials in the APK).
# International digits ONLY, no + sign. Example 79001234567.
# Leave blank until the seller provides a confirmed WhatsApp number.
[vars]
MONTHLY_PRICE_RUB = "299"
LIFETIME_PRICE_RUB = "2990"
WHATSAPP_NUMBER = "79019221000"
# Optional fallback. If empty, clients can call WHATSAPP_NUMBER.
SUPPORT_CALL_NUMBER = "79019221000"

[[d1_databases]]
binding = "DB"
database_name = "ceilingmeasure-licenses"
database_id = "REPLACE_WITH_ACTUAL_D1_DATABASE_ID"
migrations_dir = "migrations"
